name: Build Mira Windows and Android apps
on:
  push:
    branches:
      - "build/mira-native-app-*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Windows runners
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        run: flutter create --project-name mira_chat --org com.mira.assistant --platforms=android,windows .
      - name: Configure Android permissions
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<manifest\b[^>]*>", s)
          if not m:
              raise SystemExit("Manifest tag missing")
          perms = ["android.permission.INTERNET", "android.permission.RECORD_AUDIO"]
          add = "".join('\n    <uses-permission android:name="' + x + '" />' for x in perms if x not in s)
          s = s[:m.end()] + add + s[m.end():]
          if "android:usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if "android.speech.RecognitionService" not in s:
              q = '<queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>'
              s = s.replace("<application", q + "\n<application", 1)
          s = s.replace('android:label="mira_chat"', 'android:label="Mira"')
          p.write_text(s, encoding="utf-8")
          PY
      - name: Resolve Flutter packages
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        run: flutter pub get
      - name: Build Android APK
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Android-APK
          path: Mira_Cross_Platform_App/MiraChatFlutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        shell: pwsh
        run: flutter create --project-name mira_chat --org com.mira.assistant --platforms=windows,android .
      - name: Resolve Flutter packages
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        run: flutter pub get
      - name: Build Windows executable
        working-directory: Mira_Cross_Platform_App/MiraChatFlutter
        run: flutter build windows --release
      - name: Package portable app and local bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Mira_Cross_Platform_App"
          $release = Join-Path $root "MiraChatFlutter\build\windows\x64\runner\Release"
          if (!(Test-Path (Join-Path $release "mira_chat.exe"))) { throw "Release executable missing" }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\Mira-Windows"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item (Join-Path $release "*") $dist -Recurse -Force
          $server = Join-Path $dist "MiraServer"
          New-Item -ItemType Directory -Path $server -Force | Out-Null
          Copy-Item (Join-Path $root "server\mira_app_server.py") $server
          @'
          @echo off
          set PYTHONUTF8=1
          set PYTHONIOENCODING=utf-8
          cd /d D:\Mira
          python -u "%~dp0MiraServer\mira_app_server.py"
          pause
          '@ | Set-Content -LiteralPath (Join-Path $dist "Start_Mira_Server.bat") -Encoding ASCII
          @'
          Mira Windows App
          1. Run Start_Mira_Server.bat on the PC with D:\Mira installed.
          2. Keep the server window open and note COMPUTER_URL / MIRA_ACCESS_KEY.
          3. Launch mira_chat.exe and enter the URL/key in Connection settings.
          4. For Android, enter PHONE_URL on the same private Wi-Fi.
          Do not forward port 8765 publicly.
          '@ | Set-Content -LiteralPath (Join-Path $dist "README_MIRA.txt") -Encoding UTF8
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "Mira-Windows-Portable.zip") -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Windows-Portable
          path: Mira-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package local bridge
        run: |
          mkdir -p dist/Mira-Server
          cp Mira_Cross_Platform_App/server/mira_app_server.py dist/Mira-Server/
          printf '@echo off\nset PYTHONUTF8=1\nset PYTHONIOENCODING=utf-8\ncd /d D:\\Mira\npython -u "%%~dp0mira_app_server.py"\npause\n' > dist/Mira-Server/Start_Mira_Server.bat
          printf 'Run on the PC that contains D:\\Mira. Keep this window open. Use COMPUTER_URL locally and PHONE_URL on the same trusted Wi-Fi. Never expose port 8765 publicly.\n' > dist/Mira-Server/README.txt
          cd dist && zip -r "$GITHUB_WORKSPACE/Mira-Server-Bridge.zip" Mira-Server
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Server-Bridge
          path: Mira-Server-Bridge.zip
          if-no-files-found: error
          retention-days: 14
